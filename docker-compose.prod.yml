# Production overlay that adds OIDC authentication via a bundled Keycloak.
#
# Usage:
#   PUBLIC_URL=http://<host-you-browse-to>:8888 \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# This layers on top of the base docker-compose.yml: it adds a Keycloak service (auto-importing the
# `tracepcap` realm), turns on auth in the backend, and rebuilds the frontend with auth enabled.
# Everything else (Postgres, MinIO, backend, nginx) is inherited from the base file.
#
# Same-origin design: nginx proxies Keycloak (the /realms, /resources, /admin, /js paths) so the
# browser reaches the identity provider at the SAME host:port it loaded the app from. No second
# exposed port, no CORS. The frontend derives the OIDC authority from window.location at runtime.
#
# PUBLIC_URL must be the exact origin you browse to (scheme + host + port), e.g.
# http://localhost:8888, http://192.168.1.10:8888, or a Tailscale http://100.x.y.z:8888. It pins
# Keycloak's token issuer and the backend's issuer check; the browser must load the app via this
# same origin. Defaults to http://localhost:${NGINX_PORT:-8888}.
#
# Keycloak runs in `start-dev` mode (HTTP, no TLS) for offline / reverse-proxy-terminated-TLS use.
# Default demo login (change for any real deployment): analyst / analyst
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: tracepcap-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    # Keycloak is a JVM app too: 1g covers its heap plus the embedded H2 store at this scale.
    # See docs/operations/production-hardening.rst (Container Resource Limits).
    deploy:
      resources:
        limits:
          cpus: ${KEYCLOAK_CPU_LIMIT:-2}
          memory: ${KEYCLOAK_MEM_LIMIT:-1g}
    environment:
      # Admin credentials are REQUIRED here — the console is reachable on the same public origin
      # (/admin), so a shipped default would be a publicly known administrator password.
      # Compose aborts with the message below if these are unset.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env — see .env.example}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env — see .env.example}
      # Public, browser-facing base URL — determines the token `iss` claim and all KC-generated URLs.
      KC_HOSTNAME: ${PUBLIC_URL:-http://localhost:8888}
      # Trust X-Forwarded-* from the nginx proxy (same-origin reverse proxy in front of Keycloak).
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      TZ: Asia/Singapore
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # Persist Keycloak's embedded H2 store so accounts/credentials created at
      # runtime in the admin console survive container restart/recreate. Without
      # this, start-dev keeps its data inside the container and every recreate
      # wipes all users, forcing a re-import of only the realm-export.json seed.
      #
      # Mounted at the PARENT (/opt/keycloak/data), not the h2 subdirectory. Docker
      # copies image content *and ownership* into an empty named volume only when
      # the mount point exists in the image: /opt/keycloak/data does (owned by uid
      # 1000, the keycloak user), /opt/keycloak/data/h2 does not. Mounting the
      # subdirectory left the volume root-owned, so Keycloak — which runs as uid
      # 1000 — could not write its H2 file and crash-looped on any fresh volume
      # (#612). The bind mount above is applied on top of this one, so the realm
      # import is still visible and is not shadowed.
      - keycloak_data:/opt/keycloak/data
    networks:
      - tracepcap-network

  # Datastore credentials are REQUIRED in the production path. The base file defaults them to
  # well-known dev values so local/CI runs work without a .env; re-declaring them with `:?` here
  # means a production deployment cannot silently start on the shipped defaults.
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env — see .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env — see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env — see .env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env — see .env.example}

  backend:
    environment:
      # Activate the prod Spring profile (overrides the base file's `dev`): strict CORS (no
      # localhost defaults), stacktraces/exception details suppressed in error responses, Swagger
      # UI + /v3/api-docs disabled, WARN-level logging to file. See docs production-hardening.
      SPRING_PROFILES_ACTIVE: prod
      TRACEPCAP_AUTH_ENABLED: "true"
      # Re-asserted so the backend fails fast alongside the datastores rather than starting and
      # then failing to authenticate against them.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env — see .env.example}
      DATABASE_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER in .env — see .env.example}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env — see .env.example}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env — see .env.example}
      # Data egress. The base file defaults the LLM to api.openai.com for convenience in local
      # dev; inheriting that here would send capture-derived prompts (Story mode, Network
      # Insights) to a third party from the deployment most likely to hold real operational data.
      # REQUIRED, so the endpoint is always a deliberate choice — point it at a local inference
      # server (LM Studio, Ollama, vLLM) for an offline deployment.
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:?set LLM_API_BASE_URL in .env (e.g. http://<host>:1234/v1) — see .env.example}
      # Resolve GeoIP from the bundled MMDB instead of probing ipinfo.io at runtime, matching
      # docker-compose.offline.yml. Set GEO_FORCE_OFFLINE=false to opt back into online lookups.
      GEO_FORCE_OFFLINE: ${GEO_FORCE_OFFLINE:-true}
      # Public issuer (matches the token `iss`). Must equal PUBLIC_URL + /realms/tracepcap.
      KEYCLOAK_ISSUER_URI: ${PUBLIC_URL:-http://localhost:8888}/realms/tracepcap
      # Backend-reachable JWKS endpoint (internal docker network). Decouples key fetch from the
      # public issuer and is fetched lazily, so the backend need not wait for Keycloak to be ready.
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/tracepcap/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_started

  nginx:
    build:
      args:
        # Enable the OIDC flow in the SPA. The authority is derived from window.location at runtime
        # (Keycloak is proxied same-origin), so no host needs to be baked into the build.
        VITE_AUTH_ENABLED: "true"
        VITE_OIDC_CLIENT_ID: tracepcap-frontend
        VITE_OIDC_REALM: tracepcap
    depends_on:
      - backend
      - keycloak

volumes:
  keycloak_data:
    driver: local
