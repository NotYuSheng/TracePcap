# Architecture rule enforcement (#512).
#
# The layer rules in LayerDependencyTest are FROZEN, not green: the codebase violates them today,
# and the violation store records that baseline so the build fails only on NEW violations.
#
# The store is version-controlled under src/test/resources/archunit_store. Each refactor slice
# should DELETE entries from it. The store must only ever shrink — a PR that grows it is adding
# architectural debt and needs to say why.
#
# To accept a deliberate new violation, run once with:
#   mvn test -Darchunit.freeze.store.default.allowStoreUpdate=true
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false
