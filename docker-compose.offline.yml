# docker-compose.offline.yml
#
# Offline deployment variant — uses pre-built images loaded via scripts/load-images.sh
# instead of building from source.
#
# Prerequisites:
#   1. On an internet-connected machine:  bash scripts/pull-and-save-images.sh
#   2. Transfer images/, this file, and .env to the offline machine.
#   3. On the offline machine:            bash scripts/load-images.sh
#
# Start:  docker compose -f docker-compose.offline.yml up -d
# Stop:   docker compose -f docker-compose.offline.yml down

# Container resource limits (issue #378) — mirrors docker-compose.yml. See the commentary there
# and docs/operations/production-hardening.rst (Container Resource Limits) for sizing guidance.
# The backend limit tracks APP_MEMORY_MB by default; the entrypoint sizes the JVM heap at 50% of
# the enforced cgroup limit, leaving headroom for the native tshark/ndpi/Suricata subprocesses.
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tracepcap-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-2}
          memory: ${POSTGRES_MEM_LIMIT:-1g}
    environment:
      # Credentials default to the well-known dev values so the offline stack starts with no
      # .env. The production overlay requires them explicitly — see docker-compose.offline-prod.yml.
      POSTGRES_DB: ${POSTGRES_DB:-tracepcap}
      POSTGRES_USER: ${POSTGRES_USER:-tracepcap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracepcap_pass}
      TZ: Asia/Singapore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Reads the container's own POSTGRES_USER/POSTGRES_DB rather than interpolating them here,
      # so a value containing a space or shell metacharacter can't break the check (which would
      # leave postgres permanently unhealthy and block every service that depends on it).
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracepcap-network

  # MinIO Object Storage
  # bitnamilegacy/minio, NOT the official minio image. MinIO deleted its community images from
  # Docker Hub (Sept 2025) and then from quay.io (Sept 2026, anonymous pulls return 401) as it
  # deprecates the free community edition in favour of paid AIStor — the images this stack used to
  # pin are gone from both registries for good. Broadcom's `bitnamilegacy` archive is the last
  # third party still publishing the community releases (frozen, no updates). For an air-gapped
  # deploy, pre-pull/save this pinned image as with every other; if it is ever delisted too, mirror
  # it into a registry we control (e.g. GHCR).
  #
  # Bitnami's image is NOT a drop-in for the official one: its entrypoint runs the server itself (so
  # no explicit `command:`), stores data under /bitnami/minio/data (not /data), and defaults the web
  # console off (MINIO_BROWSER=on re-enables it). MINIO_ROOT_USER/PASSWORD are unchanged.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: tracepcap-minio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${MINIO_CPU_LIMIT:-2}
          memory: ${MINIO_MEM_LIMIT:-1g}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Bitnami disables the console by default; turn it on so the published :9001 port serves it.
      MINIO_BROWSER: "on"
      TZ: Asia/Singapore
    ports:
      # 9000 (the S3 API) is deliberately NOT published. The backend reaches MinIO over the
      # compose network, so a host mapping only widens who can reach object storage. If you need
      # mc/s3 tooling against it locally, add a compose override binding to loopback only:
      #   services: {minio: {ports: ["127.0.0.1:9000:9000"]}}
      # `docker compose port` only reports an existing binding; it cannot create one (#637).
      - "9001:9001"  # Console
    volumes:
      # Bitnami's data dir is /bitnami/minio/data, not /data. An existing deployment's minio_data
      # volume holds objects under /data that Bitnami won't see — see MIGRATION note in the PR.
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - tracepcap-network

  # MinIO Client (mc) - Create bucket on startup
  # One-shot bucket bootstrap: it is *meant* to exit 0, so no restart policy here.
  minio-init:
    # Same registry move as the minio service above — minio/mc is gone from Docker Hub and quay.io.
    # bitnamilegacy/minio-client ships mc at /opt/bitnami/minio-client/bin/mc, which is on PATH, so
    # the entrypoint below calls `mc` bare rather than the official image's /usr/bin/mc.
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    container_name: tracepcap-minio-init
    deploy:
      resources:
        limits:
          cpus: ${MINIO_INIT_CPU_LIMIT:-0.5}
          memory: ${MINIO_INIT_MEM_LIMIT:-128m}
    depends_on:
      - minio
    environment:
      # Passed as env vars, NOT interpolated into the entrypoint string below. Compose would
      # substitute the value textually and `sh` would then re-parse it, so a password containing
      # a space, `;`, `$$` or `"` would split the argument, run as a second command, or expand.
      # `$$VAR` escapes the `$` so the container's shell does the expansion, not Compose.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # `entrypoint` below is a FOLDED block (`>`): every newline becomes a space, so the whole
    # thing runs as one `sh -c` line. A `#` comment inside it would therefore swallow the rest of
    # the command — do not put comments in there.
    #
    # `mc anonymous set none` rather than deleting the old `set public` line: `none` also revokes
    # an existing anonymous policy, so redeploying over a stack created before this change closes
    # the hole. Deleting the line would leave an already-public bucket public (#637).
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb myminio/tracepcap-files --ignore-existing;
      mc anonymous set none myminio/tracepcap-files;
      exit 0;
      "
    networks:
      - tracepcap-network

  # Spring Boot Backend (pre-built image)
  backend:
    image: tracepcap-backend:latest
    container_name: tracepcap-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Covers JVM heap + non-heap + native tshark/ndpi/Suricata. Tracks APP_MEMORY_MB so the
          # enforced limit and the app's memory budget cannot silently diverge.
          memory: ${BACKEND_MEM_LIMIT:-${APP_MEMORY_MB:-2048}m}
          cpus: ${BACKEND_CPU_LIMIT:-4}
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Matches the base stack: auth is off unless the offline-prod overlay turns it on,
      # but the switch is at least reachable from either base file.
      TRACEPCAP_AUTH_ENABLED: ${TRACEPCAP_AUTH_ENABLED:-false}
      # Must resolve to the same values as the postgres service above.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tracepcap}
      DATABASE_USERNAME: ${POSTGRES_USER:-tracepcap_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-tracepcap_pass}
      # HikariCP connection pool (see #393). Stays under Postgres max_connections (100).
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-5}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: tracepcap-files
      APP_MEMORY_MB: ${APP_MEMORY_MB:-2048}
      # Data retention. FILE_RETENTION_ENABLED=false is the master switch — it keeps
      # uploaded files forever, and the cleanup scheduler is then not registered at all, so
      # nothing below has any effect. NOTE 0 means "never" only for the MONITOR_ and PACKET_
      # values; FILE_RETENTION_HOURS=0 means "delete everything now". Air-gapped deployments
      # are the likeliest to want indefinite retention, so these must actually be settable.
      FILE_RETENTION_ENABLED: ${FILE_RETENTION_ENABLED:-true}
      FILE_RETENTION_HOURS: ${FILE_RETENTION_HOURS:-12}
      MONITOR_FILE_RETENTION_HOURS: ${MONITOR_FILE_RETENTION_HOURS:-0}
      PACKET_RETENTION_HOURS: ${PACKET_RETENTION_HOURS:-0}
      # Present in docker-compose.yml but previously missing here, so the offline stack
      # could not tune analysis throughput or turn Suricata off (#641) — the deployment
      # most likely to want that, given it runs on whatever hardware is on site.
      SURICATA_ENABLED: ${SURICATA_ENABLED:-true}
      # Warm Suricata engine (#569): builds the ruleset once instead of per file.
      # ~45s -> ~0.5s per capture. Set false to return to a fresh subprocess per file.
      SURICATA_WARM_ENGINE_ENABLED: ${SURICATA_WARM_ENGINE_ENABLED:-true}
      SURICATA_WARM_ENGINE_SOCKET: ${SURICATA_WARM_ENGINE_SOCKET:-/tmp/tracepcap-suricata/suricata.sock}
      SURICATA_WARM_ENGINE_STARTUP_TIMEOUT: ${SURICATA_WARM_ENGINE_STARTUP_TIMEOUT:-180}
      SURICATA_WARM_ENGINE_RUN_TIMEOUT: ${SURICATA_WARM_ENGINE_RUN_TIMEOUT:-600}
      SURICATA_WARM_ENGINE_LOCK_WAIT: ${SURICATA_WARM_ENGINE_LOCK_WAIT:-900}
      SURICATA_WARM_ENGINE_COMMAND_TIMEOUT: ${SURICATA_WARM_ENGINE_COMMAND_TIMEOUT:-30}
      ASYNC_CORE_POOL_SIZE: ${ASYNC_CORE_POOL_SIZE:-5}
      ASYNC_MAX_POOL_SIZE: ${ASYNC_MAX_POOL_SIZE:-10}
      ASYNC_QUEUE_CAPACITY: ${ASYNC_QUEUE_CAPACITY:-100}
      STUCK_FILE_RECONCILIATION_ENABLED: ${STUCK_FILE_RECONCILIATION_ENABLED:-true}
      STUCK_FILE_TIMEOUT_MINUTES: ${STUCK_FILE_TIMEOUT_MINUTES:-30}
      EXTRACTION_MAX_MATCHES_PER_STREAM: ${EXTRACTION_MAX_MATCHES_PER_STREAM:-20}
      EXTRACTION_MAX_STREAM_CONVERSATIONS: ${EXTRACTION_MAX_STREAM_CONVERSATIONS:-50}
      EXTRACTION_MAX_FILE_SIZE_MB: ${EXTRACTION_MAX_FILE_SIZE_MB:-50}
      # Analysis tuning and detection thresholds. These are read by the backend
      # (application.yml) but were previously never passed in, so setting them had no
      # effect (#641). Defaults match application.yml exactly.
      GEO_ENRICHMENT_ENABLED: ${GEO_ENRICHMENT_ENABLED:-true}
      GEO_MMDB_PATH: ${GEO_MMDB_PATH:-}
      SIGNATURES_PATH: ${SIGNATURES_PATH:-/app/config/signatures.yml}
      DNS_NXDOMAIN_MIN_QUERIES: ${DNS_NXDOMAIN_MIN_QUERIES:-20}
      DNS_NXDOMAIN_SUSPICIOUS_RATIO: ${DNS_NXDOMAIN_SUSPICIOUS_RATIO:-0.5}
      HTTP_MIN_REQUESTS: ${HTTP_MIN_REQUESTS:-20}
      HTTP_CLIENT_ERROR_SUSPICIOUS_RATIO: ${HTTP_CLIENT_ERROR_SUSPICIOUS_RATIO:-0.5}
      OVERVIEW_APPS_MAX: ${OVERVIEW_APPS_MAX:-100}
      OVERVIEW_APPS_LIMITED: ${OVERVIEW_APPS_LIMITED:-true}
      # Air-gapped by default: suppress the one intentional runtime egress (ipinfo.io) and
      # resolve geo from the bundled MMDB only. Override with GEO_FORCE_OFFLINE=false if this
      # offline stack does have outbound access and you want live ipinfo.io enrichment.
      GEO_FORCE_OFFLINE: ${GEO_FORCE_OFFLINE:-true}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-http://localhost:1234/v1}
      LLM_API_KEY: ${LLM_API_KEY:-your-api-key-here}
      LLM_MODEL: ${LLM_MODEL:-gpt-4}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2000}
      LLM_CONTEXT_LENGTH: ${LLM_CONTEXT_LENGTH:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
      LLM_TOOL_CALLING: ${LLM_TOOL_CALLING:-auto}
      # Network Intelligence cluster limits
      INTELLIGENCE_MAX_CLUSTERS: ${INTELLIGENCE_MAX_CLUSTERS:-60}
      INTELLIGENCE_MAX_EDGES: ${INTELLIGENCE_MAX_EDGES:-200}
      TZ: Asia/Singapore
    volumes:
      - config_data:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - tracepcap-network

  # Nginx - Serves frontend and proxies API to backend (pre-built image)
  # Note: frontend build args (VITE_*) are baked into this image at build time.
  # To change them, rebuild the image with pull-and-save-images.sh.
  nginx:
    image: tracepcap-nginx:latest
    container_name: tracepcap-nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${NGINX_CPU_LIMIT:-1}
          memory: ${NGINX_MEM_LIMIT:-256m}
    environment:
      APP_MEMORY_MB: ${APP_MEMORY_MB:-2048}
      # The BACKEND's enforced cap, so nginx mirrors the backend's effective budget rather than
      # sizing the edge body limit from APP_MEMORY_MB alone. See docker-compose.yml.
      BACKEND_MEM_LIMIT: ${BACKEND_MEM_LIMIT:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
      TZ: Asia/Singapore
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - tracepcap-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  config_data:
    driver: local

networks:
  tracepcap-network:
    driver: bridge
