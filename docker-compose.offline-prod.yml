# docker-compose.offline-prod.yml
#
# Offline + authentication overlay. Layers OIDC auth (a bundled Keycloak) on top of the
# offline stack, using pre-built images loaded via scripts/load-images.sh — the offline
# equivalent of docker-compose.prod.yml (which builds from source and cannot run air-gapped).
#
# Prerequisites:
#   1. On an internet-connected machine, INCLUDE Keycloak when saving images:
#          INCLUDE_KEYCLOAK=true bash scripts/pull-and-save-images.sh
#      This saves the Keycloak image AND an auth-enabled frontend (tracepcap-nginx-auth).
#   2. Transfer images/, this file, docker-compose.offline.yml, keycloak/realm-export.json,
#      .env, and scripts/load-images.sh to the offline machine.
#   3. On the offline machine:  bash scripts/load-images.sh
#
# Start (layer this file ON TOP of the base offline file):
#   PUBLIC_URL=http://<host>:8888 \
#     docker compose -f docker-compose.offline.yml -f docker-compose.offline-prod.yml up -d
#
# PUBLIC_URL must be the exact origin you browse to (scheme + host + port). It pins Keycloak's
# token issuer and the backend's issuer check; the browser must load the app via this same
# origin. It does NOT track NGINX_PORT — default is http://localhost:8888. See
# docs/configuration/authentication.rst and docs/getting-started/offline-deployment.rst.
#
# Manage users at <PUBLIC_URL>/admin (Keycloak admin console, served same-origin by nginx).
# The realm seeds a demo app login (analyst / analyst) — change it for any real deployment.
# The Keycloak admin account has NO default here: KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD must
# be set in .env or this overlay aborts before starting anything.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: tracepcap-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    # Keycloak is a JVM app too: 1g covers its heap plus the embedded H2 store at this scale.
    # See docs/operations/production-hardening.rst (Container Resource Limits).
    deploy:
      resources:
        limits:
          cpus: ${KEYCLOAK_CPU_LIMIT:-2}
          memory: ${KEYCLOAK_MEM_LIMIT:-1g}
    environment:
      # REQUIRED — the admin console is reachable on the same public origin (/admin), so a
      # shipped default would be a publicly known administrator password.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env — see .env.example}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env — see .env.example}
      # Public, browser-facing base URL — determines the token `iss` claim and all KC URLs.
      KC_HOSTNAME: ${PUBLIC_URL:-http://localhost:8888}
      # Trust X-Forwarded-* from the nginx proxy (same-origin reverse proxy in front of KC).
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      TZ: Asia/Singapore
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # Persist Keycloak's embedded H2 store so accounts/credentials created at
      # runtime in the admin console survive container restart/recreate. (The
      # online prod overlay is ephemeral by the same start-dev design; persistence
      # matters more offline, where re-provisioning users is manual.)
      - keycloak_data:/opt/keycloak/data
    networks:
      - tracepcap-network

  # Datastore credentials are REQUIRED in the production path. The base offline file defaults them
  # so an air-gapped smoke test works without a .env; re-declaring them with `:?` here means a real
  # offline deployment cannot silently start on the shipped defaults.
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env — see .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env — see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env — see .env.example}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env — see .env.example}

  backend:
    environment:
      # Activate the prod Spring profile (overrides the base offline file's `dev`): strict CORS (no
      # localhost defaults), stacktraces/exception details suppressed in error responses, Swagger
      # UI + /v3/api-docs disabled, WARN-level logging to file. See docs production-hardening.
      SPRING_PROFILES_ACTIVE: prod
      TRACEPCAP_AUTH_ENABLED: "true"
      # Re-asserted so the backend fails fast alongside the datastores rather than starting and
      # then failing to authenticate against them.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env — see .env.example}
      DATABASE_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER in .env — see .env.example}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env — see .env.example}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env — see .env.example}
      # Data egress. REQUIRED, matching docker-compose.prod.yml. The base offline file defaults
      # this to http://localhost:1234/v1, which resolves to the *backend container itself*, not to
      # any inference host on the network — so inheriting it would leave Story mode and Network
      # Insights failing at request time with a connection error instead of at startup.
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:?set LLM_API_BASE_URL in .env (e.g. http://<host>:1234/v1) — see .env.example}
      # Restated so an air-gapped deployment's guarantee doesn't rest on a default in the file
      # below it. Left overridable: a deployment with internet access may opt back in.
      GEO_FORCE_OFFLINE: ${GEO_FORCE_OFFLINE:-true}
      # Public issuer (matches the token `iss`). Must equal PUBLIC_URL + /realms/tracepcap.
      KEYCLOAK_ISSUER_URI: ${PUBLIC_URL:-http://localhost:8888}/realms/tracepcap
      # Backend-reachable JWKS endpoint (internal docker network), fetched lazily so the
      # backend need not wait for Keycloak to be ready.
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/tracepcap/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_started

  nginx:
    # Auth-enabled frontend built by pull-and-save-images.sh when Keycloak is included.
    # Overrides the plain tracepcap-nginx:latest from the base offline file.
    image: tracepcap-nginx-auth:latest
    depends_on:
      - backend
      - keycloak

volumes:
  keycloak_data:
    driver: local
