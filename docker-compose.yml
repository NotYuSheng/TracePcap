# Container resource limits (issue #378)
# ---------------------------------------
# `deploy.resources.limits` IS honoured by Compose v2 `up` (it is not Swarm-only, unlike
# `deploy.resources.reservations`, which is a no-op outside Swarm — CPU/memory *requests* are a
# Kubernetes scheduling concept and are deliberately not modelled here; see #366 Helm work).
#
# The backend limit is the one that matters: it must cover the JVM heap PLUS the native
# tshark/ndpi/Suricata subprocesses, which allocate outside the heap. BACKEND_MEM_LIMIT therefore
# tracks APP_MEMORY_MB by default, and backend/docker-entrypoint.sh reads this enforced cgroup
# limit to size the heap at 50% of it. Raising APP_MEMORY_MB alone raises both in step.
#
# Sizing guidance and the validated minimums live in
# docs/operations/production-hardening.rst (Container Resource Limits).
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tracepcap-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-2}
          memory: ${POSTGRES_MEM_LIMIT:-1g}
    environment:
      # Credentials default to the well-known dev values so `docker compose up` works with
      # no .env (local dev, CI). The production overlays require them to be set explicitly —
      # see docker-compose.prod.yml. Override in .env for any shared deployment.
      POSTGRES_DB: ${POSTGRES_DB:-tracepcap}
      POSTGRES_USER: ${POSTGRES_USER:-tracepcap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracepcap_pass}
      TZ: Asia/Singapore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Reads the container's own POSTGRES_USER/POSTGRES_DB rather than interpolating them here,
      # so a value containing a space or shell metacharacter can't break the check (which would
      # leave postgres permanently unhealthy and block every service that depends on it).
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracepcap-network

  # MinIO Object Storage
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tracepcap-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: ${MINIO_CPU_LIMIT:-2}
          memory: ${MINIO_MEM_LIMIT:-1g}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: Asia/Singapore
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - tracepcap-network

  # MinIO Client (mc) - Create bucket on startup
  # One-shot bucket bootstrap: it is *meant* to exit 0, so it gets no restart policy
  # (`unless-stopped` would restart it forever) and needs only a nominal memory cap.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: tracepcap-minio-init
    deploy:
      resources:
        limits:
          cpus: ${MINIO_INIT_CPU_LIMIT:-0.5}
          memory: ${MINIO_INIT_MEM_LIMIT:-128m}
    depends_on:
      - minio
    environment:
      # Passed as env vars, NOT interpolated into the entrypoint string below. Compose would
      # substitute the value textually and `sh` would then re-parse it, so a password containing
      # a space, `;`, `$` or `"` would split the argument, run as a second command, or expand.
      # `$$VAR` escapes the `$` so the container's shell does the expansion, not Compose.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      /usr/bin/mc mb myminio/tracepcap-files --ignore-existing;
      /usr/bin/mc anonymous set public myminio/tracepcap-files;
      exit 0;
      "
    networks:
      - tracepcap-network

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracepcap-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Must cover JVM heap + JVM non-heap + native tshark/ndpi/Suricata subprocesses.
          # Defaults to APP_MEMORY_MB so the enforced limit and the app's memory budget cannot
          # silently diverge; the entrypoint sizes the heap at 50% of this limit. Override only
          # if you deliberately want the cgroup cap to differ from APP_MEMORY_MB.
          memory: ${BACKEND_MEM_LIMIT:-${APP_MEMORY_MB:-2048}m}
          # Analysis is subprocess-heavy and parallel (ASYNC_MAX_POOL_SIZE=10 by default), so the
          # backend is the service that will actually use several cores. Sized above the others.
          cpus: ${BACKEND_CPU_LIMIT:-4}
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Authentication off by default — the app runs fully open (e.g. Lanturn). To enable OIDC,
      # use docker-compose.prod.yml (bundles Keycloak) or set TRACEPCAP_AUTH_ENABLED + KEYCLOAK_* envs.
      TRACEPCAP_AUTH_ENABLED: ${TRACEPCAP_AUTH_ENABLED:-false}
      # Must resolve to the same values as the postgres service above.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tracepcap}
      DATABASE_USERNAME: ${POSTGRES_USER:-tracepcap_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-tracepcap_pass}
      # HikariCP connection pool. Sized above the base default so concurrent analysis inserts +
      # request traffic don't starve the pool. Stays well under Postgres max_connections (100). See #393.
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-5}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: tracepcap-files
      # Memory allocation — all limits (JVM heap, max upload, timeouts) are derived
      # from this single value in the container entrypoint script
      APP_MEMORY_MB: ${APP_MEMORY_MB:-2048}
      # LLM Configuration (OpenAI API Format)
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-your-api-key-here}
      LLM_MODEL: ${LLM_MODEL:-gpt-4}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2000}
      LLM_CONTEXT_LENGTH: ${LLM_CONTEXT_LENGTH:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
      # Network Intelligence cluster limits
      INTELLIGENCE_MAX_CLUSTERS: ${INTELLIGENCE_MAX_CLUSTERS:-60}
      INTELLIGENCE_MAX_EDGES: ${INTELLIGENCE_MAX_EDGES:-200}
      # File extraction limits (see .env.example)
      EXTRACTION_MAX_MATCHES_PER_STREAM: ${EXTRACTION_MAX_MATCHES_PER_STREAM:-20}
      EXTRACTION_MAX_STREAM_CONVERSATIONS: ${EXTRACTION_MAX_STREAM_CONVERSATIONS:-50}
      EXTRACTION_MAX_FILE_SIZE_MB: ${EXTRACTION_MAX_FILE_SIZE_MB:-50}
      # Suppress ipinfo.io runtime egress (the one intentional external call). true = MMDB-only
      # geo, no probe/lookups — for air-gapped deployments. See .env.example.
      GEO_FORCE_OFFLINE: ${GEO_FORCE_OFFLINE:-false}
      # Global Suricata IDS kill-switch. false = skip Suricata for every file (biggest throughput
      # lever, ~94% of per-file analysis cost). See .env.example.
      SURICATA_ENABLED: ${SURICATA_ENABLED:-true}
      # Analysis queue sizing + stuck-file reconciliation (see .env.example / docs)
      ASYNC_CORE_POOL_SIZE: ${ASYNC_CORE_POOL_SIZE:-5}
      ASYNC_MAX_POOL_SIZE: ${ASYNC_MAX_POOL_SIZE:-10}
      ASYNC_QUEUE_CAPACITY: ${ASYNC_QUEUE_CAPACITY:-100}
      STUCK_FILE_RECONCILIATION_ENABLED: ${STUCK_FILE_RECONCILIATION_ENABLED:-true}
      STUCK_FILE_TIMEOUT_MINUTES: ${STUCK_FILE_TIMEOUT_MINUTES:-30}
      # Timezone Configuration
      TZ: Asia/Singapore
    volumes:
      - config_data:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - tracepcap-network

  # Nginx - Serves frontend and proxies API to backend
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_SUPPORTED_FILE_TYPES: ${VITE_SUPPORTED_FILE_TYPES:-.pcap,.pcapng,.cap}
        VITE_NETWORK_DIAGRAM_CONVERSATION_LIMIT: ${VITE_NETWORK_DIAGRAM_CONVERSATION_LIMIT:-false}
        # The default below is rewritten on every merge to main by
        # .github/workflows/app-version.yml — it is the version local builds bake in.
        # Export APP_VERSION to override (CI passes the live `git describe` for GHCR images).
        VITE_APP_VERSION: ${APP_VERSION:-v0.1.1-208-g00b0dfd}
    container_name: tracepcap-nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # proxy_request_buffering defaults to on, so nginx buffers the whole request body — but
          # anything past client_body_buffer_size spills to disk in /tmp rather than RAM, so the
          # cap holds regardless of upload size. 256m covers workers + in-memory proxy buffers.
          cpus: ${NGINX_CPU_LIMIT:-1}
          memory: ${NGINX_MEM_LIMIT:-256m}
    environment:
      # Memory allocation — nginx body limit and timeouts derived from this
      APP_MEMORY_MB: ${APP_MEMORY_MB:-2048}
      # The BACKEND's enforced cap, passed through so nginx can mirror the backend's *effective*
      # budget. nginx cannot read another container's cgroup, so without this the edge body limit
      # would be sized from APP_MEMORY_MB while the backend enforces a smaller cap — nginx would
      # accept an upload Spring then rejects. Must stay in sync with the backend's memory limit.
      BACKEND_MEM_LIMIT: ${BACKEND_MEM_LIMIT:-}
      # LLM timeout — nginx proxy_read_timeout is set to max(memory-derived, LLM_TIMEOUT+60s)
      LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
      # Timezone Configuration
      TZ: Asia/Singapore
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - tracepcap-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  config_data:
    driver: local

networks:
  tracepcap-network:
    driver: bridge
