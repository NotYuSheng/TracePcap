name: Frontend Unit Tests

on:
  workflow_dispatch:
  # Also on merge, so main has a continuous coverage history rather than only per-PR
  # readings. The ratchet in #659 needs a trustworthy floor measured from main.
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'frontend/**'
      # endpointPaths.test.ts checks every frontend URL against the backend's committed route
      # snapshot, so a backend-only route change must re-run these tests too — otherwise the
      # frontend silently points at a route that no longer exists.
      - 'openapi/**'
      - '.github/workflows/test-frontend.yml'

permissions:
  contents: read

jobs:
  test:
    name: vitest run
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The committed schema must match openapi/baseline.json exactly. Regenerate and diff:
      # a stale schema means the contract types lie, and the compile-time guards in
      # contractConformance.test-d.ts would be checking against a contract that no longer
      # exists. This workflow already triggers on openapi/**, so a backend route change lands
      # here immediately. See #659.
      - name: Check generated API types are current
        run: |
          npm run api:types
          if ! git diff --exit-code -- src/services/api/generated/schema.d.ts; then
            echo "::error::src/services/api/generated/schema.d.ts is stale. Run 'npm run api:types' in frontend/ and commit the result."
            exit 1
          fi

      # tsconfig.app.json excludes tests so the production image build stays free of them, so this
      # is the only place they get type-checked. contractConformance.test-d.ts has no runtime body
      # — it is checked here, by refusing to compile, not by vitest.
      - name: Type-check tests
        run: npm run typecheck:test

      # --coverage rather than a bare run: report-only, but it makes the figure visible
      # on every PR instead of something nobody can quote. See #659.
      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          SUMMARY=coverage/coverage-summary.json
          if [ ! -f "$SUMMARY" ]; then
            echo "No coverage summary produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const rows = ["statements","branches","functions","lines"]
              .map(k => `| ${k} | ${t[k].covered} | ${t[k].total} | ${t[k].pct}% |`)
              .join("\n");
            console.log(`## Frontend coverage\n\n| Metric | Covered | Total | % |\n|---|---:|---:|---:|\n${rows}`);
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
