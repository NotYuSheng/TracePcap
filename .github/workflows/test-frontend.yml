name: Frontend Unit Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      # endpointPaths.test.ts checks every frontend URL against the backend's committed route
      # snapshot, so a backend-only route change must re-run these tests too — otherwise the
      # frontend silently points at a route that no longer exists.
      - 'openapi/**'
      - '.github/workflows/test-frontend.yml'

permissions:
  contents: read

jobs:
  test:
    name: vitest run
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsconfig.app.json excludes tests so the production image build stays free of them, so this
      # is the only place they get type-checked.
      - name: Type-check tests
        run: npm run typecheck:test

      # --coverage rather than a bare run: report-only, but it makes the figure visible
      # on every PR instead of something nobody can quote. See #659.
      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          SUMMARY=coverage/coverage-summary.json
          if [ ! -f "$SUMMARY" ]; then
            echo "No coverage summary produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const rows = ["statements","branches","functions","lines"]
              .map(k => `| ${k} | ${t[k].covered} | ${t[k].total} | ${t[k].pct}% |`)
              .join("\n");
            console.log(`## Frontend coverage\n\n| Metric | Covered | Total | % |\n|---|---:|---:|---:|\n${rows}`);
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
