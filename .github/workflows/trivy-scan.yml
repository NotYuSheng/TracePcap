name: Trivy Image Scan

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to scan (default: latest)"
        required: false
        default: "latest"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read           # required for SARIF upload in private repos
      security-events: write  # required for SARIF upload to Security tab

    strategy:
      matrix:
        include:
          - name: tracepcap-backend
          - name: tracepcap-nginx
          # Third-party image we ship in the prod overlays. Its tag comes from the compose file
          # (not image_tag), so the scan always matches what we actually deploy.
          - name: keycloak
            compose_image: quay.io/keycloak/keycloak

    steps:
      - name: Check out compose files
        if: matrix.compose_image
        uses: actions/checkout@v4

      - name: Resolve image reference
        env:
          COMPOSE_IMAGE: ${{ matrix.compose_image }}
        run: |
          if [ -n "$COMPOSE_IMAGE" ]; then
            IMAGE=$(grep -oE "${COMPOSE_IMAGE}:[^[:space:]\"]+" docker-compose.prod.yml | head -1)
            [ -n "$IMAGE" ] || { echo "::error::$COMPOSE_IMAGE not found in docker-compose.prod.yml"; exit 1; }
          else
            REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE="ghcr.io/${REPO_OWNER_LOWER}/${{ matrix.name }}:${{ github.event.inputs.image_tag }}"
          fi
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy scan (SARIF)
        # Note: severity filtering is ignored in SARIF mode — all severities are
        # included in the SARIF file; use the Security tab UI to filter by severity.
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true  # silently skip if Advanced Security is not enabled
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Run Trivy scan (table summary)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          output: trivy-${{ matrix.name }}-summary.txt
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Write results to job summary
        if: always()
        run: |
          echo "## Trivy Scan — \`${{ env.IMAGE }}\`" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-${{ matrix.name }}-summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
