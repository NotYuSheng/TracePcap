name: Sync App Version

# Keeps the APP_VERSION file at the repo root pointing at the latest dev commit, so a
# plain image build bakes in a real version with no local setup (nginx/Dockerfile
# reads it when no VITE_APP_VERSION build arg is given).
#
# It's a file of its own, not a default in docker-compose.yml, on purpose: a bump PR
# touching docker-compose.yml matched the path filters of five compose workflows, and
# because this PR merges and deletes its branch within seconds, those runs ended as
# "failure" with no jobs, five phantom red runs on every merge to dev.
#
# main is a protected branch (changes must go through a PR), so this cannot push
# directly. It opens a bump PR and merges it immediately, retrying while GitHub
# finishes computing mergeability: main requires a PR but no reviews and no status
# checks, so the PR is mergeable the moment it exists. The merge is done with
# GITHUB_TOKEN, which by design cannot trigger workflows — so the bump PR merging
# does not retrigger this workflow or publish-ghcr.yml.

on:
  push:
    branches:
      - dev

# Serialise runs so two quick merges to main can't open competing bump PRs.
concurrency:
  group: sync-app-version
  cancel-in-progress: false

jobs:
  sync-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe --tags` reaches the nearest tag.
          fetch-depth: 0

      - name: Resolve version
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)
          if [ -z "$VERSION" ] || [ "$VERSION" = "dev" ]; then
            echo "::error::Resolved version is empty or 'dev' — refusing to write an untraceable version."
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Write the APP_VERSION file
        run: printf '%s\n' "$VERSION" > APP_VERSION

      - name: Open and auto-merge a bump PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet APP_VERSION; then
            echo "APP_VERSION already up to date — no PR needed."
            exit 0
          fi

          BRANCH="chore/sync-version-${VERSION}"
          # Export so the cleanup step below can reach it. The branch is pushed before the
          # PR exists, so every failure between here and the merge would otherwise strand it
          # on the remote with no PR — and with no PR, delete-branch-on-close.yml never fires.
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add APP_VERSION
          git commit -m "chore: sync app version to ${VERSION}"
          git push --force-with-lease origin "$BRANCH"

          # Reuse an existing open PR for this branch if the run is retried.
          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base dev \
              --head "$BRANCH" \
              --title "chore: sync app version to ${VERSION}" \
              --body "Automated: keeps the APP_VERSION file pointing at the latest dev commit. Opened by .github/workflows/app-version.yml.")
          fi

          # Step off the bump branch: git refuses to delete a checked-out branch.
          git checkout --detach

          # Delete the remote branch ourselves rather than via `gh pr merge --delete-branch`.
          # On a detached HEAD gh cannot resolve a current branch, so --delete-branch fails
          # with "could not determine current branch: not on any branch" *after* the remote
          # merge has already gone through. gh then exits nonzero, the loop below falls to
          # its "already merged" check and returns 0 — with the branch still on the remote.
          # That is how bump branches kept piling up (#663).
          delete_bump_branch() {
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null 2>&1; then
              echo "Deleted ${BRANCH}"
            else
              echo "Branch ${BRANCH} already gone."
            fi
          }

          # Auto-merge only queues a merge behind pending requirements, and GitHub
          # rejects it outright for a PR that is already mergeable ("Pull request is
          # in clean status"). main has no required reviews or status checks, so a
          # bump PR is always clean on creation and must be merged directly.
          #
          # Retry rather than falling back to --auto on any error: right after
          # `gh pr create` GitHub may still report mergeability as UNKNOWN, and a
          # blanket `|| gh pr merge --auto` would also mask a real failure (e.g. a
          # conflict against a moved main) as a green step that never lands the PR.
          for attempt in 1 2 3 4 5; do
            gh pr merge "$PR_URL" --squash || true

            # Ask GitHub rather than trusting gh's exit code: the merge frequently lands
            # even when gh reports failure (see the note above).
            if [ "$(gh pr view "$PR_URL" --json state --jq .state)" = "MERGED" ]; then
              echo "Merged $PR_URL"
              delete_bump_branch
              exit 0
            fi
            echo "Merge attempt $attempt failed; mergeability may still be computing. Retrying..."
            sleep 10
          done

          echo "::error::Could not merge $PR_URL after 5 attempts — it needs a look."
          exit 1

      # Only reached when the step above failed, which means the PR never reached MERGED and
      # the branch was never deleted. Without this it is stranded on the remote: if the PR
      # was never created there is no pull_request event for delete-branch-on-close.yml to
      # act on either. This is the one branch-leak route neither of those covers.
      - name: Remove the bump branch if it never merged
        if: failure() && env.BRANCH != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Close any open PR first so it does not linger pointing at a deleted branch.
          # No --delete-branch: this job runs on a detached HEAD, where gh cannot resolve a
          # current branch and the flag fails. Delete the ref through the API instead.
          gh pr close "$BRANCH" 2>/dev/null || true

          if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Removed stranded branch $BRANCH"
          else
            echo "Nothing to remove for $BRANCH."
          fi
