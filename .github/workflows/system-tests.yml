name: System Tests

on:
  workflow_dispatch:
  # Also on merge, not only per-PR. A PR run proves the branch was sound at the time; nothing
  # re-checked main after it landed, so a semantic conflict between two independently-green
  # PRs would go unnoticed until someone opened the next one (#659).
  push:
    # main only, not dev. Every PR into dev already ran this before merging, so re-running it on each
    # merge mostly queued behind the next PR's checks (GitHub's ~20-concurrent-job cap). The
    # cross-PR semantic-conflict catch (#659) still happens: on the release PR into main, and on main.
    branches:
      - main
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'nginx/**'
      - '.github/actions/build-stack/**'
      - '.github/workflows/system-tests.yml'
      - '.github/workflows/system-tests-run.yml'

permissions:
  contents: read

jobs:
  system:
    uses: ./.github/workflows/system-tests-run.yml
    with:
      arch: amd64
      runner: ubuntu-latest
    secrets: inherit
