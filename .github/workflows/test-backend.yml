name: Backend Tests

on:
  workflow_dispatch:
  # Also on merge, so main has a continuous coverage history rather than only per-PR
  # readings. The ratchet in #659 needs a trustworthy floor measured from main.
  push:
    # main only, not dev. Every PR into dev already ran this before merging, so re-running it on each
    # merge mostly queued behind the next PR's checks (GitHub's ~20-concurrent-job cap). The
    # cross-PR semantic-conflict catch (#659) still happens: on the release PR into main, and on main.
    branches:
      - main
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/test-backend.yml'

permissions:
  contents: read

jobs:
  test:
    name: mvn verify (JUnit + Testcontainers)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # DOCKERHUB_USERNAME/TOKEN are mirrored from secrets here because `if:` cannot reference the
    # secrets context directly — GitHub rejects the whole workflow file at parse time if it does
    # ("Unrecognized named-value: 'secrets'"). env: is one of the few places secrets IS allowed,
    # and env context (unlike secrets context) is readable from if:.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticated pulls aren't subject to Docker Hub's anonymous-pull rate limit, which has
      # intermittently denied Testcontainers' pulls of the (unchanged, legitimate) minio image
      # PacketPartitionIntegrationTest/PipelineIntegrationTest need. Guarded so a fork PR without
      # these secrets degrades to the previous behaviour rather than failing outright.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # tshark, editcap and capinfos, because without them the tool-dependent tests pass while
      # testing nothing (#701). Those services degrade gracefully by design, so a missing binary
      # is not an error — the subprocess fails to start, the catch fires, the method returns
      # early, and the assertions still hold. Verified by hiding tshark from PATH locally:
      # DnsQueryLogExtractorTest reported 13 passed either way. The 4-point coverage gap between
      # this job and a developer's machine was that, made visible.
      #
      # Suricata is deliberately not installed: it is ~700MB of ruleset and ~45s of engine build
      # per run (#569), and the full-stack job already exercises it against a real container.
      - name: Install packet-analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tshark
          tshark --version | head -1

      # Ubuntu 26.04 ships an AppArmor profile that confines tshark on the host, and under it tshark
      # cannot read the fixtures in the checkout ("You don't have permission to read the file",
      # exit 3), so WebServerLogExtractorRealCaptureTest got empty results (#871). The confinement
      # is a property of the runner host, not of the app: production runs tshark inside the backend
      # container, which this profile does not apply to. Unload whichever packet-tool profiles
      # exist. It is a no-op on images that don't ship one.
      - name: Unconfine tshark (runner AppArmor)
        run: |
          for f in /etc/apparmor.d/*; do
            case "$(basename "$f")" in
              *tshark*|*wireshark*|*dumpcap*) echo "unloading $f"; sudo apparmor_parser -R "$f" || true ;;
            esac
          done
          sudo aa-status 2>/dev/null | grep -i -E 'tshark|wireshark|dumpcap' || echo "no packet-tool profiles loaded"

      # Testcontainers needs a Docker daemon; ubuntu runners provide one.
      - name: Run unit + integration tests
        run: mvn -B clean verify

      # JaCoCo is report-only (no <check> rule is bound), so this step reports the
      # number rather than gating on it. Establishing a truthful baseline comes first;
      # the ratchet lands once we know what we are ratcheting from. See #659.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "No JaCoCo report produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR>1 {
            miss_i += $4; cov_i += $5; miss_b += $6; cov_b += $7; miss_l += $8; cov_l += $9
          } END {
            printf "## Backend coverage\n\n"
            printf "| Metric | Covered | Total | %% |\n|---|---:|---:|---:|\n"
            printf "| Instructions | %d | %d | %.2f%% |\n", cov_i, cov_i+miss_i, 100*cov_i/(cov_i+miss_i)
            printf "| Branches | %d | %d | %.2f%% |\n", cov_b, cov_b+miss_b, (cov_b+miss_b) ? 100*cov_b/(cov_b+miss_b) : 0
            printf "| Lines | %d | %d | %.2f%% |\n", cov_l, cov_l+miss_l, 100*cov_l/(cov_l+miss_l)
          }' "$CSV" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 14
