name: MinIO Volume Upgrade

# Catches a compose change that stops MinIO starting on an existing deployment's volume. Volumes
# created before #838 are root-owned, the Chainguard image runs as UID 65532, and every other CI
# job starts from an empty volume — so the crash-loop in #854 passed all of them. This seeds a
# root-owned volume and asserts MinIO still comes up, from each compose file that runs it.

on:
  pull_request:
    paths:
      - 'docker-compose*.yml'
      - 'scripts/check_minio_volume_upgrade.sh'
      - '.github/workflows/minio-volume-upgrade.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'docker-compose*.yml'
      - 'scripts/check_minio_volume_upgrade.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: MinIO starts on a pre-#838 volume
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Start MinIO on a root-owned volume
        run: bash scripts/check_minio_volume_upgrade.sh
